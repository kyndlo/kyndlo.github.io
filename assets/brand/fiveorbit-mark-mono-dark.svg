<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" role="img" aria-labelledby="title desc"><title id="title">FiveOrbit Studio</title><desc id="desc">Five family members on three orbits. Two large parents, three small children, an open center. Two blue and three purple spheres.</desc><defs>
