<radialGradient id="blue" cx=".28" cy=".2" r=".9"><stop stop-color="#83f7ff"/><stop offset=".32" stop-color="#16d4ef"/><stop offset="1" stop-color="#1760ff"/></radialGradient>
<radialGradient id="purple" cx=".28" cy=".2" r=".9"><stop stop-color="#e5b0ff"/><stop offset=".35" stop-color="#b760fa"/><stop offset="1" stop-color="#5823ef"/></radialGradient>
<mask id="ring-gaps"><rect width="320" height="270" fill="white"/><circle cx="264.56" cy="51.44" r="26" fill="black"/><circle cx="68.55" cy="228.04" r="27" fill="black"/><circle cx="113.91" cy="121.05" r="14" fill="black"/><circle cx="248.52" cy="133.88" r="16" fill="black"/><circle cx="186.57" cy="221.75" r="16" fill="black"/></mask></defs><g mask="url(#ring-gaps)"><g fill="none" stroke="#080c19" stroke-width="4" transform="rotate(-32 160 135)"><ellipse cx="160" cy="135" rx="135" ry="89"/><ellipse cx="160" cy="135" rx="107" ry="65"/><ellipse cx="160" cy="135" rx="75" ry="40"/></g></g><circle data-body="parent-blue" cx="264.56" cy="51.44" r="22" fill="#080c19"/><circle data-body="parent-purple" cx="68.55" cy="228.04" r="23" fill="#080c19"/><circle data-body="child-purple-inner" cx="113.91" cy="121.05" r="10" fill="#080c19"/><circle data-body="child-purple-right" cx="248.52" cy="133.88" r="12" fill="#080c19"/><circle data-body="child-blue-bottom" cx="186.57" cy="221.75" r="12" fill="#080c19"/></svg>
